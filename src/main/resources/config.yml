# StarlitPaper — settings based on Starlit 1.1.1 defaults
# Starlit draws procedural GPU shaders. This plugin reconstructs their spatial
# patterns with server-side particles for unmodified vanilla clients.

enabled: true
render-interval-ticks: 10

performance:
  # Particle budget per player per render pass. Higher = denser sky and more traffic.
  max-particles-per-pass: 700

stars:
  enabled: true
  count: 5000
  brightness: 100
  twinkle: 50
  colored: true
  at-dusk: true
  spikes: true

# Original Starlit intensity is 0..200.
milky-way: 100
nebulae: true
galaxies: true
planets: true
moon-glow: true
constellations:
  enabled: true
  lines: false

meteors:
  shooting-stars: 50
  fireballs: true
  meteor-showers: 15
  comets: 10
  announce: true
  wishes: true

aurora:
  mode: cold # off, cold, always
  colors: classic # classic, vivid, crimson, ice
  brightness: 100

atmosphere:
  enabled: true
  sunsets: true
  halos: true
  rainbows: true
  birds: true

worlds:
  overworld: true
  end-sky: true
  nether-effects: false

# Limitations of the Paper server API:
# it cannot inject Starlit's original GPU shaders, replace the vanilla sky,
# or recreate the client-only Mod Menu/keybind and Iris/Oculus integration.
