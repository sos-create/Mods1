# StarlitPaper 1.2.0 — Paper translation of Starlit 1.1.1
# Put the original Fabric archive in plugins/StarlitPaper/adapters/.
# The adapter inspects its metadata and shader catalogue; it never loads Fabric code.

adapter:
  source-jar: adapters/starlit-1.1.1-mc1.21.4.jar

enabled: true
render-interval-ticks: 10

performance:
  max-particles-per-pass: 1200

stars:
  enabled: true
  count: 5000
  brightness: 100
  twinkle: 50
  colored: true
  at-dusk: true
  spikes: true

milky-way: 100
nebulae: true
galaxies: true
planets: true
moon-glow: true
constellations:
  enabled: true
  lines: false

meteors:
  shooting-stars: 50
  fireballs: true
  meteor-showers: 15
  comets: 10
  announce: true
  wishes: true

aurora:
  mode: cold
  colors: classic
  brightness: 100

atmosphere:
  enabled: true
  sunsets: true
  halos: true
  rainbows: true
  birds: true

worlds:
  overworld: true
  end-sky: true
  nether-effects: false

# Paper has no API for injecting client GLSL into unmodified vanilla clients.
# The adapter translates procedural shader families to server-side particles.
