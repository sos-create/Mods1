plugins {
    id 'java'
}

group = 'com.soscreate'
version = '1.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

sourceSets {
    // Compile-time copies of the UniversalModSync public API. These classes
    // are deliberately excluded from the adapter JAR; at runtime the adapter
    // links to the real API exported by the UniversalModSync plugin.
    adapterApi {
        java.srcDir 'src/adapterApi/java'
    }
    adapter {
        java {
            srcDirs = ['src/adapter/java', 'src/main/java']
            include 'com/soscreate/starlitpaper/StarlitUniversalAdapter.java'
            include 'com/soscreate/starlitpaper/SkyRenderer.java'
            include 'com/soscreate/starlitpaper/SkyMath.java'
            include 'com/soscreate/starlitpaper/SkyNoise.java'
            include 'com/soscreate/starlitpaper/StarCatalog.java'
        }
        resources.srcDir 'src/adapter/resources'
        compileClasspath += sourceSets.adapterApi.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('compileAdapterJava') {
    dependsOn tasks.named('compileAdapterApiJava')
}

tasks.register('adapterJar', Jar) {
    dependsOn tasks.named('adapterClasses')
    archiveFileName = 'starlit-universalmodsync-adapter.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from sourceSets.adapter.output
    // Do not bundle UniversalModSync API classes: they must be shared with
    // the parent plugin class loader to preserve Java type identity.
    exclude 'com/soscreate/universalmodsync/**'
}

tasks.named('build') {
    dependsOn tasks.named('adapterJar')
}

tasks.test {
    useJUnitPlatform()
}

processResources {
    filteringCharset = 'UTF-8'
}

jar {
    archiveFileName = 'zima.jar'
}
