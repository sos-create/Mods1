plugins {
    id 'java'
}

group = 'com.soscreate'
version = '1.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

sourceSets {
    adapterApi {
        java.srcDir 'src/adapterApi/java'
        compileClasspath += configurations.compileClasspath
    }
    adapter {
        java {
            srcDirs = ['src/adapter/java', 'src/main/java']
            include 'com/soscreate/starlitpaper/StarlitUniversalAdapter.java'
            include 'com/soscreate/starlitpaper/SkyRenderer.java'
            include 'com/soscreate/starlitpaper/SkyMath.java'
            include 'com/soscreate/starlitpaper/SkyNoise.java'
            include 'com/soscreate/starlitpaper/StarCatalog.java'
        }
        compileClasspath += sourceSets.adapterApi.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    chiselsAdapter {
        java.srcDir 'src/adapter/java'
        java.include 'com/soscreate/chiselsbits/ChiselsBitsUniversalAdapter.java'
        compileClasspath += sourceSets.adapterApi.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('compileAdapterJava') {
    dependsOn tasks.named('compileAdapterApiJava')
}

tasks.named('compileChiselsAdapterJava') {
    dependsOn tasks.named('compileAdapterApiJava')
}

tasks.register('adapterJar', Jar) {
    dependsOn tasks.named('adapterClasses')
    archiveFileName = 'starlit-universalmodsync-adapter.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from sourceSets.adapter.output
    exclude 'com/soscreate/universalmodsync/**'
}

tasks.register('chiselsAdapterJar', Jar) {
    dependsOn tasks.named('chiselsAdapterClasses')
    archiveFileName = 'chisels-and-bits-universalmodsync-adapter.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from sourceSets.chiselsAdapter.output
    exclude 'com/soscreate/universalmodsync/**'
}

tasks.named('build') {
    dependsOn tasks.named('adapterJar')
    dependsOn tasks.named('chiselsAdapterJar')
}

tasks.test {
    useJUnitPlatform()
}

processResources {
    filteringCharset = 'UTF-8'
}

jar {
    archiveFileName = 'zima.jar'
}
