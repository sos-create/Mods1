name: Build StarlitPaper and UniversalModSync adapter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test plugin and adapter
        run: gradle --no-daemon clean build
      - name: Upload UniversalModSync adapter
        uses: actions/upload-artifact@v4
        with:
          name: starlit-universalmodsync-adapter
          path: build/libs/starlit-universalmodsync-adapter.jar
      - name: Upload standalone Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: zima
          path: build/libs/zima.jar
